      additionalProperties: false
      description: The position and size of the panel on the dashboard grid.
      type: object
      properties:
        h:
          default: 15
          description: The height of the panel in grid units. Minimum `1`. Defaults to `15`.
          minimum: 1
          type: number
        w:
          default: 24
          description: The width of the panel in grid units. Minimum `1`, maximum `48`.
            Defaults to `24`.
          maximum: 48
          minimum: 1
          type: number
        x:
          description: The x coordinate of the panel in grid units.
          type: number
        'y':
