    Kibana_HTTP_APIs_kbn-dashboard-options:
      additionalProperties: false
      default:
        auto_apply_filters: true
        hide_panel_borders: false
        hide_panel_titles: false
        sync_colors: false
        sync_cursor: true
        sync_tooltips: false
        use_margins: true
      description: Display and behavior settings for the dashboard.
      properties:
        auto_apply_filters:
          default: true
          description: When `true`, control filter changes are applied automatically. When
            `false`, control filter changes are applied manually through the
            dashboard's search update button. Defaults to `true`.
          type: boolean
        hide_panel_borders:
          default: false
          description: When `true`, panel borders are hidden. Defaults to `false`.
          type: boolean
        hide_panel_titles:
          default: false
          description: When `true`, panel titles are hidden. Defaults to `false`.
          type: boolean
        sync_colors:
          default: false
          description: When `true`, colors are synchronized across panels that share a
            data source. Defaults to `false`.
          type: boolean
        sync_cursor:
          default: true
          description: When `true`, the cursor position is synchronized across panels.
            Defaults to `true`.
          type: boolean
        sync_tooltips:
          default: false
          description: When `true`, tooltips are synchronized across panels. Defaults to
            `false`.
          type: boolean
        use_margins:
          default: true
          description: When `true`, panels are separated by a margin. Defaults to `true`.
          type: boolean
      title: Options
      type: object
