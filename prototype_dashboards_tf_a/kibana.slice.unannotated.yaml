    Kibana_HTTP_APIs_visMetricStyling:
      additionalProperties: false
      description: Visual chart styling options
      type: object
      properties:
        density:
          anyOf:
            - enum:
                - compact
              type: string
            - enum:
                - default
              type: string
          default: default
          description: Density preset for the metric chart layout. Use `compact` for a
            compact layout, or `default` for increased padding, element spacing,
            and font size.
        icon:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_visMetricIconConfig'
        primary:
          additionalProperties: false
          type: object
          properties:
            labels:
              additionalProperties: false
              description: Labels (title and subtitle) configuration
              type: object
              properties:
                alignment:
                  default: left
                  description: 'Horizontal alignment for the title and subtitle text. Accepted
                    values: `left`, `center`, `right`. Defaults to `left`.'
                  enum:
                    - left
                    - center
                    - right
                  type: string
            position:
              default: bottom
              description: Position of the primary metric value (top, middle, or bottom).
              enum:
                - top
                - middle
                - bottom
              type: string
            value:
              additionalProperties: false
              description: Primary metric value configuration
              type: object
              properties:
                alignment:
                  default: right
                  description: 'Alignment for the primary metric value. Accepted values: `left`,
                    `center`, `right`. Defaults to `right`.'
                  enum:
                    - left
                    - center
                    - right
                  type: string
                sizing:
                  anyOf:
                    - enum:
                        - auto
                      type: string
                    - enum:
                        - fill
                      type: string
                  default: auto
                  description: Controls how the primary value text is sized within the panel.
                    'auto' selects a font size from predefined breakpoints based
                    on panel height, then shrinks if the text overflows
                    horizontally. 'fill' scales the text to be as large as
                    possible, filling all available space.
        secondary:
          additionalProperties: false
          type: object
          properties:
            label:
              additionalProperties: false
              type: object
              properties:
                placement:
                  default: before
                  description: 'How the secondary metric name is shown: before the value, after
                    the value, or in a tooltip. Ignored when the label is not
                    visible.'
                  enum:
                    - before
                    - after
                    - tooltip
                  type: string
                visible:
                  default: false
                  description: When `true`, displays the secondary metric name as its label.
                  type: boolean
            value:
              additionalProperties: false
              description: Secondary metric value configuration
              type: object
              properties:
                alignment:
                  default: right
                  description: 'Alignment for secondary values. Accepted values: `left`, `center`,
                    `right`. Defaults to `right`.'
                  enum:
                    - left
                    - center
                    - right
                  type: string
