          default: false
          description: When `true`, the section is collapsed and its panels are not
            rendered until expanded. Useful for improving initial load time on
            large dashboards. Defaults to `false`.
          type: boolean
        grid:
          additionalProperties: false
          type: object
          properties:
            'y':
              description: The y coordinate of the section in grid units.
              type: number
          required:
            - 'y'
        id:
          description: The unique ID of the section.
          type: string
        panels:
          default: []
          description: The panels that belong to the section.
          items:
