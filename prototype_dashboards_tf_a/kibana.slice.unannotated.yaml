openapi: 3.0.3
info:
  contact:
    name: Kibana Team
  description: |
    The Kibana REST API enables you to manage resources such as connectors, data views, and saved objects.
    The API calls are stateless.
    Each request that you make happens in isolation from other calls and must include all of the necessary information for Kibana to fulfill the
    request.
    API requests return JSON output, which is a format that is machine-readable and works well for automation.

    To interact with the Kibana API, use the following operations:

    - GET: Fetches the information.
    - PATCH: Applies partial modifications to the existing information.
    - POST: Adds new information.
    - PUT: Updates the existing information.
    - DELETE: Removes the information.

    You can prepend any Kibana API endpoint with `kbn:` and run the request in **Dev Tools → Console**.
    For example:

    ```
    GET kbn:/api/data_views
    ```

    For more information about the console, refer to [Run API requests](https://www.elastic.co/docs/explore-analyze/query-filter/tools/console).

    NOTE: Access to internal Kibana API endpoints will be restricted in Kibana version 9.0. Please move any integrations to publicly documented APIs.

    ## Documentation source and versions

    This documentation is derived from the `main` branch of the [kibana](https://github.com/elastic/kibana) repository.
    It is provided under license [Attribution-NonCommercial-NoDerivatives 4.0 International](https://creativecommons.org/licenses/by-nc-nd/4.0/).

    This documentation contains work-in-progress information for future Elastic Stack releases.
  title: Kibana API
  version: ''
  x-doc-license:
    name: Attribution-NonCommercial-NoDerivatives 4.0 International
    url: https://creativecommons.org/licenses/by-nc-nd/4.0/
  x-feedbackLink:
    label: Feedback
    url: https://github.com/elastic/docs-content/issues/new?assignees=&labels=feedback%2Ccommunity&projects=&template=api-feedback.yaml&title=%5BFeedback%5D%3A+
servers:
  - url: http://{kibana_host}:{port}
    variables:
      kibana_host:
        default: localhost
      port:
        default: '5601'
  - url: http://localhost:5601
paths:
  /api/dashboards:
    post:
      operationId: create-dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-data'
      responses:
        '201':
          description: created
      summary: Create a dashboard
      tags:
        - Dashboards
components:
  schemas:
    Kibana_HTTP_APIs_esqlDataSource:
      additionalProperties: false
      description: Uses an ES|QL query as the data source. The query is executed at
        render time; resulting columns are available as fields.
      type: object
      properties:
        query:
          description: 'An ES|QL query that drives the data source. The query must produce
            a tabular result set; column names are used as field references.
            Example: "FROM logs-* | STATS count = COUNT(*) BY host.name".'
          type: string
        type:
          enum:
            - esql
          type: string
      required:
        - type
        - query
      title: ES|QL Data Source
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeConditionFilterSchema:
      additionalProperties: false
      description: A filter that evaluates a single field condition such as equality,
        range, or existence.
      title: condition
      type: object
      properties:
        condition:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_conditionSchema'
        controlled_by:
          description: Identifier of the panel that manages this filter. When set, the
            filter is treated as owned by that panel.
          type: string
        data_view_id:
          description: Identifier of the data view used as context for this filter.
          type: string
        disabled:
          description: When `true`, the filter is inactive and does not affect query
            results. Defaults to `false`.
          type: boolean
        is_multi_index:
          description: When `true`, the filter can be applied across multiple indices.
            Defaults to `false`.
          type: boolean
        label:
          description: Human-readable label for the filter, used for display purposes.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        type:
          enum:
            - condition
          type: string
      required:
        - type
        - condition
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeDSLFilterSchema:
      additionalProperties: false
      description: A filter expressed as a raw [Elasticsearch Query
        DSL](https://www.elastic.co/docs/reference/query-languages/querydsl)
        object, used for queries that cannot be represented by condition or
        group filters.
      title: dsl
      type: object
      properties:
        controlled_by:
          description: Identifier of the panel that manages this filter. When set, the
            filter is treated as owned by that panel.
          type: string
        data_view_id:
          description: Identifier of the data view used as context for this filter.
          type: string
        disabled:
          description: When `true`, the filter is inactive and does not affect query
            results. Defaults to `false`.
          type: boolean
        dsl:
          additionalProperties: {}
          description: Elasticsearch Query DSL object passed directly to the query.
          type: object
        field:
          description: Field name for scripted filters where the field cannot be extracted
            from the DSL query.
          type: string
        is_multi_index:
          description: When `true`, the filter can be applied across multiple indices.
            Defaults to `false`.
          type: boolean
        label:
          description: Human-readable label for the filter, used for display purposes.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        params:
          description: Filter parameters metadata. May contain display values, formats,
            and parameters for scripted filters.
        type:
          enum:
            - dsl
          type: string
      required:
        - type
        - dsl
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeFilterSchema:
      description: A filter applied to query results. Can be a field condition
        (`condition`), a logical group of conditions (`group`), a raw
        Elasticsearch DSL query (`dsl`), or a geo spatial query (`spatial`).
      discriminator:
        mapping:
          condition: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeConditionFilterSchema'
          dsl: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeDSLFilterSchema'
          group: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeGroupFilterSchema'
          spatial: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeSpatialFilterSchema'
        propertyName: type
      oneOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeConditionFilterSchema'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeGroupFilterSchema'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeDSLFilterSchema'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeSpatialFilterSchema'
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeGroupFilterSchema:
      additionalProperties: false
      description: A filter that combines multiple conditions or nested groups using a
        logical `and` or `or` operator.
      title: group
      type: object
      properties:
        controlled_by:
          description: Identifier of the panel that manages this filter. When set, the
            filter is treated as owned by that panel.
          type: string
        data_view_id:
          description: Identifier of the data view used as context for this filter.
          type: string
        disabled:
          description: When `true`, the filter is inactive and does not affect query
            results. Defaults to `false`.
          type: boolean
        group:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_groupConditionSchema'
        is_multi_index:
          description: When `true`, the filter can be applied across multiple indices.
            Defaults to `false`.
          type: boolean
        label:
          description: Human-readable label for the filter, used for display purposes.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        type:
          enum:
            - group
          type: string
      required:
        - type
        - group
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_asCodeSpatialFilterSchema:
      additionalProperties: false
      description: A filter that applies an Elasticsearch geo query, used for
        geographic boundary and shape matching.
      title: spatial
      type: object
      properties:
        controlled_by:
          description: Identifier of the panel that manages this filter. When set, the
            filter is treated as owned by that panel.
          type: string
        data_view_id:
          description: Identifier of the data view used as context for this filter.
          type: string
        disabled:
          description: When `true`, the filter is inactive and does not affect query
            results. Defaults to `false`.
          type: boolean
        dsl:
          additionalProperties: {}
          description: Elasticsearch geo query DSL object.
          type: object
        is_multi_index:
          description: When `true`, the filter can be applied across multiple indices.
            Defaults to `false`.
          type: boolean
        label:
          description: Human-readable label for the filter, used for display purposes.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        type:
          enum:
            - spatial
          type: string
      required:
        - type
        - dsl
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_exists:
      additionalProperties: false
      description: Matches documents where `field` exists and contains a non-null value.
      title: exists
      type: object
      properties:
        field:
          description: Name of the document field the condition evaluates.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        operator:
          enum:
            - exists
          type: string
      required:
        - field
        - operator
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is:
      additionalProperties: false
      description: Matches documents where `field` equals a single specified value.
      title: is
      type: object
      properties:
        field:
          description: Name of the document field the condition evaluates.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        operator:
          enum:
            - is
          type: string
        value:
          anyOf:
            - title: value
              type: string
            - title: value
              type: number
            - title: value
              type: boolean
          description: Single value to compare against the field.
      required:
        - field
        - operator
        - value
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is_one_of:
      additionalProperties: false
      description: Matches documents where `field` equals any value in a provided list.
      title: is_one_of
      type: object
      properties:
        field:
          description: Name of the document field the condition evaluates.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        operator:
          enum:
            - is_one_of
          type: string
        value:
          anyOf:
            - items:
                type: string
              maxItems: 10000
              type: array
            - items:
                type: number
              maxItems: 10000
              type: array
            - items:
                type: boolean
              maxItems: 10000
              type: array
          description: Homogeneous array of values to match against the field.
      required:
        - field
        - operator
        - value
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_range:
      additionalProperties: false
      description: Matches documents where `field` falls within a specified numeric or
        date range.
      title: range
      type: object
      properties:
        field:
          description: Name of the document field the condition evaluates.
          type: string
        negate:
          description: When `true`, the filter is negated and matches documents that do
            NOT satisfy the condition. Defaults to `false`.
          type: boolean
        operator:
          enum:
            - range
          type: string
        value:
          additionalProperties: false
          description: Boundary values for a range comparison.
          type: object
          properties:
            format:
              description: Elasticsearch [date
                format](https://www.elastic.co/docs/reference/elasticsearch/mapping-reference/mapping-date-format)
                string applied when parsing date boundary values. For example,
                `strict_date_optional_time` or `epoch_millis`.
              type: string
            gt:
              anyOf:
                - type: number
                - type: string
              description: Greater than.
            gte:
              anyOf:
                - type: number
                - type: string
              description: Greater than or equal to.
            lt:
              anyOf:
                - type: number
                - type: string
              description: Less than.
            lte:
              anyOf:
                - type: number
                - type: string
              description: Less than or equal to.
      required:
        - field
        - operator
        - value
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_conditionSchema:
      description: A filter condition with strict operator/value type matching.
      discriminator:
        mapping:
          exists: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_exists'
          is: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is'
          is_one_of: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is_one_of'
          range: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_range'
        propertyName: operator
      oneOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_is_one_of'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_range'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_condition_exists'
    Kibana_HTTP_APIs_kbn-as-code-filters-schema_groupConditionSchema:
      additionalProperties: false
      description: Logical group that combines one or more conditions or nested groups.
      type: object
      properties:
        conditions:
          description: Ordered list of conditions or nested groups combined by the group
            `operator`.
          items:
            anyOf:
              - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_conditionSchema'
              - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-as-code-filters-schema_groupConditionSchema'
          type: array
        operator:
          anyOf:
            - enum:
                - and
              type: string
            - enum:
                - or
              type: string
          description: Logical operator applied across all entries in `conditions`. Use
            `and` to require all conditions, or `or` to require at least one.
      required:
        - operator
        - conditions
    Kibana_HTTP_APIs_kbn-as-code-query:
      additionalProperties: false
      description: A search query consisting of an expression and its language.
        Supports KQL and Lucene syntax.
      type: object
      properties:
        expression:
          description: A query expression in KQL or Lucene syntax.
          type: string
        language:
          description: Query language. Use `kql` for Kibana Query Language (KQL) or
            `lucene` for Lucene query syntax.
          enum:
            - kql
            - lucene
          type: string
      required:
        - expression
        - language
      title: Query
    Kibana_HTTP_APIs_kbn-composite-runtime-field-schema:
      additionalProperties: false
      type: object
      properties:
        fields:
          additionalProperties:
            $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-base-schema'
          type: object
        script:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-script'
        type:
          enum:
            - composite
          type: string
      required:
        - type
        - fields
      title: Composite runtime field
    Kibana_HTTP_APIs_kbn-content-management-utils-referenceSchema:
      additionalProperties: false
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
      required:
        - name
        - type
        - id
    Kibana_HTTP_APIs_kbn-controls-schemas-controls-group-schema-esql-control:
      additionalProperties: false
      description: An ES|QL variable control whose selected value is injected into
        ES|QL visualizations using the `?variable_name` syntax. Options can come
        from a fixed list or an ES|QL query. Define the options source in
        `config`.
      type: object
      properties:
        config:
          discriminator:
            mapping:
              STATIC_VALUES: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-esql-control-schema-static-values'
              VALUES_FROM_QUERY: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-esql-control-schema-values-from-query'
            propertyName: control_type
          oneOf:
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-esql-control-schema-static-values'
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-esql-control-schema-values-from-query'
        grow:
          default: false
          description: When `true`, the control expands to fill any available horizontal
            space. Defaults to `false`.
          type: boolean
        id:
          description: The unique ID of the control
          type: string
        type:
          enum:
            - esql_control
          type: string
        width:
          anyOf:
            - enum:
                - small
              type: string
            - enum:
                - medium
              type: string
            - enum:
                - large
              type: string
          default: medium
          description: Minimum width of the control panel.
      required:
        - type
        - config
      title: esql_control
    Kibana_HTTP_APIs_kbn-controls-schemas-controls-group-schema-options-list-control:
      additionalProperties: false
      description: A dropdown control that filters data by selecting field values from
        a data view. Define the data view, field, and selection settings in
        `config`.
      type: object
      properties:
        config:
          discriminator:
            mapping:
              esql: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-dsl-control-schema-esql'
            propertyName: values_source
          oneOf:
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-dsl-control-schema-esql'
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-options-list-dsl-control-schema-field'
        grow:
          default: false
          description: When `true`, the control expands to fill any available horizontal
            space. Defaults to `false`.
          type: boolean
        id:
          description: The unique ID of the control
          type: string
        type:
          enum:
            - options_list_control
          type: string
        width:
          anyOf:
            - enum:
                - small
              type: string
            - enum:
                - medium
              type: string
            - enum:
                - large
              type: string
          default: medium
          description: Minimum width of the control panel.
      required:
        - type
        - config
      title: options_list_control
    Kibana_HTTP_APIs_kbn-controls-schemas-controls-group-schema-range-slider-control:
      additionalProperties: false
      description: A slider control that filters data by selecting a numeric range for
        the configured field. Define the data view, field, and selection
        settings in `config`.
      type: object
      properties:
        config:
          discriminator:
            mapping:
              esql: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-range-slider-control-schema-esql'
            propertyName: values_source
          oneOf:
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-range-slider-control-schema-esql'
            - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-controls-schemas-range-slider-control-schema-field'
        grow:
          default: false
          description: When `true`, the control expands to fill any available horizontal
            space. Defaults to `false`.
          type: boolean
        id:
          description: The unique ID of the control
          type: string
        type:
          enum:
            - range_slider_control
          type: string
        width:
          anyOf:
            - enum:
                - small
              type: string
            - enum:
                - medium
              type: string
            - enum:
                - large
              type: string
          default: medium
          description: Minimum width of the control panel.
      required:
        - type
        - config
      title: range_slider_control
    Kibana_HTTP_APIs_kbn-controls-schemas-controls-group-schema-time-slider-control:
      additionalProperties: false
      description: A control panel that filters a time field to a selected sub-range
        of the global time range. Define the start and end positions in `config`
        as fractions of the global range (0 to 1).
      type: object
      properties:
        config:
          additionalProperties: false
          type: object
          properties:
            end_percentage_of_time_range:
              default: 1
              description: The end of the selected time window expressed as a fraction of the
                global time range, where `0` is the beginning and `1` is the end
                of the range.
              maximum: 1
              minimum: 0
              type: number
            is_anchored:
              default: false
              description: When `true`, the start of the time window is fixed at the beginning
                of the global time range. Only the end of the window can be
                adjusted. Defaults to `false`.
              type: boolean
            start_percentage_of_time_range:
              default: 0
              description: The start of the selected time window expressed as a fraction of
                the global time range, where `0` is the beginning and `1` is the
                end of the range.
              maximum: 1
              minimum: 0
              type: number
        grow:
          default: false
          description: When `true`, the control expands to fill any available horizontal
            space. Defaults to `false`.
          type: boolean
        id:
          description: The unique ID of the control
          type: string
        type:
          enum:
            - time_slider_control
          type: string
        width:
          anyOf:
            - enum:
                - small
              type: string
            - enum:
                - medium
              type: string
            - enum:
                - large
              type: string
          default: medium
          description: Minimum width of the control panel.
      required:
        - type
        - config
      title: time_slider_control
    Kibana_HTTP_APIs_kbn-controls-schemas-options-list-dsl-control-schema-esql:
      additionalProperties: false
      description: An options list control whose available options come from an ES|QL
        query's results.
      type: object
      properties:
        display_settings:
          additionalProperties: false
          type: object
          properties:
            hide_action_bar:
              description: When `true`, the search bar, sorting options, and select all toggle
                are hidden from the control.
              type: boolean
            hide_exclude:
              description: When `true`, the exclude mode toggle is hidden from the control.
              type: boolean
            hide_exists:
              description: When `true`, the exists filter option is hidden from the control.
              type: boolean
            hide_sort:
              description: When `true`, the sort selector is hidden from the control.
              type: boolean
            placeholder:
              description: Placeholder text displayed in the control input when no option is
                selected.
              type: string
        esql_query:
          description: The ES|QL query that provides field options for this control
          minLength: 1
          type: string
        exclude:
          default: false
          description: When `true`, the control filters to documents that do NOT match the
            selected options. Defaults to `false`.
          type: boolean
        exists_selected:
          default: false
          description: When `true`, the control filters to documents where the field
            exists, regardless of the field's value. Defaults to `false`.
          type: boolean
        ignore_validations:
          default: false
          description: When `true`, the control skips selection validation and does not
            report which selections are responsible for returning zero results.
          type: boolean
        run_past_timeout:
          default: false
          description: When `true`, the options list query continues running even if it
            exceeds the configured timeout threshold. Defaults to `false`.
          type: boolean
        search_technique:
          anyOf:
            - enum:
                - prefix
              type: string
            - enum:
                - wildcard
              type: string
            - enum:
                - exact
              type: string
          default: wildcard
          description: The matching technique used when searching available options.
            `prefix` matches values starting with the search term, `wildcard`
            matches values containing the search term, and `exact` requires a
            complete match. Only applies to string and IP fields. Defaults to
            `wildcard`.
        selected_options:
          default: []
          description: The list of currently selected option values.
          items:
            anyOf:
              - type: string
              - type: number
            description: A selected option value. Accepts a string or a number.
          maxItems: 10000
          type: array
        single_select:
          default: false
          description: When `true`, only one option can be selected at a time. Selecting a
            new option deselects any previously selected option. Defaults to
            `false`.
          type: boolean
        sort:
          additionalProperties: false
          default:
            by: _count
            direction: desc
          description: 'Defines how the available options are sorted in the control
            popover. Defaults to `{ by: "_count", direction: "desc" }`.'
          type: object
          properties:
            by:
              description: The field used to sort the available options list. `_count` sorts
