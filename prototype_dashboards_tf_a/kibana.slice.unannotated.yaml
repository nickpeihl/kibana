          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-dashboard-panel-grid'
        id:
          description: The unique ID of the panel.
          type: string
        type:
          enum:
            - vis
          type: string
      required:
        - type
        - grid
        - config
      title: Visualization
    Kibana_HTTP_APIs_kbn-dashboard-section:
      additionalProperties: false
