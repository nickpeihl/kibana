    Kibana_HTTP_APIs_kbn-controls-schemas-options-list-dsl-control-schema-field:
      additionalProperties: false
      description: An options list control whose available options come from a data
        view field.
      type: object
      properties:
        data_view_id:
          description: The ID of the data view that provides field options for this control.
          minLength: 1
          type: string
        display_settings:
          additionalProperties: false
          type: object
          properties:
            hide_action_bar:
              description: When `true`, the search bar, sorting options, and select all toggle
                are hidden from the control.
              type: boolean
            hide_exclude:
              description: When `true`, the exclude mode toggle is hidden from the control.
              type: boolean
            hide_exists:
              description: When `true`, the exists filter option is hidden from the control.
              type: boolean
            hide_sort:
              description: When `true`, the sort selector is hidden from the control.
              type: boolean
            placeholder:
              description: Placeholder text displayed in the control input when no option is
                selected.
              type: string
        exclude:
          default: false
          description: When `true`, the control filters to documents that do NOT match the
            selected options. Defaults to `false`.
          type: boolean
        exists_selected:
          default: false
          description: When `true`, the control filters to documents where the field
            exists, regardless of the field's value. Defaults to `false`.
          type: boolean
        field_name:
          description: The name of the field in the data view that this control filters on.
          minLength: 1
          type: string
        ignore_validations:
          default: false
          description: When `true`, the control skips selection validation and does not
            report which selections are responsible for returning zero results.
          type: boolean
        run_past_timeout:
          default: false
          description: When `true`, the options list query continues running even if it
            exceeds the configured timeout threshold. Defaults to `false`.
          type: boolean
        search_technique:
          anyOf:
            - enum:
                - prefix
              type: string
            - enum:
                - wildcard
              type: string
            - enum:
                - exact
              type: string
          default: wildcard
          description: The matching technique used when searching available options.
            `prefix` matches values starting with the search term, `wildcard`
            matches values containing the search term, and `exact` requires a
            complete match. Only applies to string and IP fields. Defaults to
            `wildcard`.
        selected_options:
          default: []
          description: The list of currently selected option values.
          items:
            anyOf:
              - type: string
              - type: number
            description: A selected option value. Accepts a string or a number.
          maxItems: 10000
          type: array
        single_select:
          default: false
          description: When `true`, only one option can be selected at a time. Selecting a
            new option deselects any previously selected option. Defaults to
            `false`.
          type: boolean
        sort:
          additionalProperties: false
          default:
            by: _count
            direction: desc
          description: 'Defines how the available options are sorted in the control
            popover. Defaults to `{ by: "_count", direction: "desc" }`.'
          type: object
          properties:
            by:
              description: The field used to sort the available options list. `_count` sorts
                by document count and `_key` sorts alphabetically by option
                value.
              enum:
                - _count
                - _key
              type: string
            direction:
              description: The sort direction. `asc` sorts ascending and `desc` sorts
                descending.
              enum:
                - asc
                - desc
              type: string
          required:
            - by
            - direction
        title:
          description: A human-readable title for the control.
          type: string
        use_global_filters:
          default: true
          description: When `true`, the control's available options are narrowed by the
            page's active filters.
          type: boolean
        values_source:
          anyOf:
            - enum:
                - field
              type: string
          default: field
          description: The source of the field options for this control. Defaults to
            `field` for legacy controls.
      required:
        - data_view_id
        - field_name
      title: FieldOptionsListControl
