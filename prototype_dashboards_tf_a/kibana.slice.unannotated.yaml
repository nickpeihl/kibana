        - grid
    Kibana_HTTP_APIs_kbn-data-service-server-refreshIntervalSchema:
      additionalProperties: false
      description: Specifies the auto-refresh interval for the object.
      type: object
      properties:
        pause:
          description: When `true`, auto-refresh is paused.
          type: boolean
        value:
          description: The refresh interval in milliseconds.
          type: number
      required:
        - pause
        - value
      title: Refresh interval
    Kibana_HTTP_APIs_kbn-data-view-field-setting:
      additionalProperties: false
      description: Display overrides for a field. These settings can define a custom
        label, description, and format.
      title: Field settings
      type: object
      properties:
        custom_description:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-description'
        custom_label:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-label'
        format:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format'
    Kibana_HTTP_APIs_kbn-data-view-reference-schema:
      additionalProperties: false
      type: object
      properties:
        ref_id:
          description: 'The id of the Kibana data view to use as the data source. Example:
            "my-data-view".'
          type: string
        type:
          enum:
            - data_view_reference
          type: string
      required:
        - type
        - ref_id
      title: Data view reference
    Kibana_HTTP_APIs_kbn-data-view-spec-schema:
      additionalProperties: false
      type: object
      properties:
        allow_hidden_indices:
          description: When `true`, allows the data view to match hidden indices.
          title: Allow hidden and system indices
          type: boolean
        field_filters:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-filters-schema'
        field_settings:
          additionalProperties:
            $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-settings-entry'
          description: Settings for individual fields, keyed by field name. To change how
            Kibana displays a field from the backing indices, set its label,
            description, or format. To define a runtime field, use the runtime
            field name and set `type`.
          title: Field settings
          type: object
        index_pattern:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-index-pattern-schema'
        name:
          description: 'The name of the data view. Example: "Sample data view".'
          maxLength: 256
          minLength: 1
          title: Data view name
          type: string
        time_field:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-time-field-schema'
        type:
          enum:
            - data_view_spec
          type: string
      required:
        - type
        - index_pattern
      title: Data view inline spec
    Kibana_HTTP_APIs_kbn-es-query-server-timeRangeSchema:
      additionalProperties: false
      description: Specifies the time range for a query.
      type: object
      properties:
        from:
          description: The start of the time range. Accepts Elasticsearch [date
            math](https://www.elastic.co/docs/reference/elasticsearch/rest-apis/common-options#date-math)
            expressions (for example, `now-7d`) or ISO 8601 timestamps.
          type: string
        mode:
          anyOf:
            - enum:
                - absolute
              type: string
            - enum:
                - relative
              type: string
          description: The time range mode. Use `absolute` for fixed start and end
            timestamps. Use `relative` for [date
            math](https://www.elastic.co/docs/reference/elasticsearch/rest-apis/common-options#date-math)
            expressions that are re-evaluated at query time (for example,
            `now-7d`).
        to:
          description: The end of the time range. Accepts Elasticsearch [date
            math](https://www.elastic.co/docs/reference/elasticsearch/rest-apis/common-options#date-math)
            expressions (for example, `now`) or ISO 8601 timestamps.
          type: string
      required:
        - from
        - to
      title: Time range
    Kibana_HTTP_APIs_kbn-field-custom-description:
      description: Add a description to the field. It's displayed next to the field on
        the Discover, Lens, and Data View Management pages.
      minLength: 1
      title: Custom description
      type: string
    Kibana_HTTP_APIs_kbn-field-custom-label:
      description: Create a label to display in place of the field name in Discover,
        Maps, Lens, Visualize, and TSVB. Useful for shortening a long field
        name. Queries and filters use the original field name.
      minLength: 1
      title: Custom label
      type: string
    Kibana_HTTP_APIs_kbn-field-filters-schema:
      description: Field filters can be used to exclude one or more fields when
        fetching a document. They may contain wildcards, such as `user*` which
        filters fields starting with 'user'.
      items:
        maxLength: 1000
        minLength: 1
        type: string
      maxItems: 10000
      title: Field filters
      type: array
    Kibana_HTTP_APIs_kbn-field-format:
      anyOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-boolean'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-bytes'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-color'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-currency'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-date_nanos'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-date'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-duration'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-geo_point'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-histogram'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-ip'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-number'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-percent'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-relative_date'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-static_lookup'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-string'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-truncate'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format-url'
        - additionalProperties: false
          description: Fallback for custom formatter IDs only. Known formatter IDs must
            match their dedicated schema and are validated at runtime.
          type: object
          properties:
            params: {}
            type:
              type: string
          required:
            - type
          title: Extensible format
      description: Set your preferred format for displaying the value. Changing the
        format can affect the value and prevent highlighting in Discover.
      title: Format
    Kibana_HTTP_APIs_kbn-field-format-boolean:
      additionalProperties: false
      description: Formats a field into a true/false value.
      type: object
      properties:
        type:
          enum:
            - boolean
          type: string
      required:
        - type
      title: Boolean field format
    Kibana_HTTP_APIs_kbn-field-format-bytes:
      additionalProperties: false
      description: Formats a field into a bytes value following the numeral.js format
        pattern. The default pattern is defined by the
        format:bytes:defaultPattern advanced setting.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            pattern:
              description: Numeral.js format pattern. See
                https://www.elastic.co/docs/explore-analyze/numeral-formatting
                to learn more.
              title: Numeral pattern
              type: string
        type:
          enum:
            - bytes
          type: string
      required:
        - type
      title: Bytes field format
    Kibana_HTTP_APIs_kbn-field-format-color:
      additionalProperties: false
      description: Formats a field into a color value.
      type: object
      properties:
        params:
          discriminator:
            propertyName: field_type
          oneOf:
            - additionalProperties: false
              type: object
              properties:
                colors:
                  items:
                    type: object
                    properties:
                      background:
                        description: The background color to use for the field.
                        title: Background color
                        type: string
                      regex:
                        description: When the field type is a string, this regex is used to determine
                          the color.
                        title: Regex
                        type: string
                      text:
                        description: The text color to use for the field.
                        title: Text color
                        type: string
                    required:
                      - text
                      - background
                      - regex
                  type: array
                field_type:
                  enum:
                    - string
                  type: string
              required:
                - field_type
                - colors
            - additionalProperties: false
              type: object
              properties:
                colors:
                  items:
                    type: object
                    properties:
                      background:
                        description: The background color to use for the field.
                        title: Background color
                        type: string
                      range:
                        description: When the field type is a number, this range is used to determine
                          the color.
                        title: Range
                        type: string
                      text:
                        description: The text color to use for the field.
                        title: Text color
                        type: string
                    required:
                      - text
                      - background
                      - range
                  type: array
                field_type:
                  enum:
                    - number
                  type: string
                pattern:
                  description: Numeral.js format pattern. See
                    https://www.elastic.co/docs/explore-analyze/numeral-formatting
                    to learn more.
                  title: Numeral pattern
                  type: string
              required:
                - field_type
                - colors
            - additionalProperties: false
              type: object
              properties:
                colors:
                  items:
                    type: object
                    properties:
                      background:
                        description: The background color to use for the field.
                        title: Background color
                        type: string
                      boolean:
                        description: When the field type is a boolean, this boolean is used to determine
                          the color.
                        title: Boolean
                        type: boolean
                      text:
                        description: The text color to use for the field.
                        title: Text color
                        type: string
                    required:
                      - text
                      - background
                      - boolean
                  type: array
                field_type:
                  enum:
                    - boolean
                  type: string
              required:
                - field_type
                - colors
        type:
          enum:
            - color
          type: string
      required:
        - type
        - params
      title: Color field format
    Kibana_HTTP_APIs_kbn-field-format-currency:
      additionalProperties: false
      description: Formats a field into a currency value. The format is determined by
        the pattern of the format:currency:defaultPattern advanced setting.
      type: object
      properties:
        type:
          enum:
            - currency
          type: string
      required:
        - type
      title: Currency field format
    Kibana_HTTP_APIs_kbn-field-format-date:
      additionalProperties: false
      description: Formats a field into a date value following the defined pattern.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            pattern:
              default: MMM D, YYYY @ HH:mm:ss.SSS
              description: Moment.js format pattern. See https://momentjs.com/ to learn more.
              title: Moment.js pattern
              type: string
        type:
          enum:
            - date
          type: string
      required:
        - type
      title: Date field format
    Kibana_HTTP_APIs_kbn-field-format-date_nanos:
      additionalProperties: false
      description: Formats a field into a date nanos value following the defined pattern.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            pattern:
              default: MMM D, YYYY @ HH:mm:ss.SSSSSSSSS
              description: Moment.js format pattern. See https://momentjs.com/ to learn more.
              title: Moment.js pattern
              type: string
        type:
          enum:
            - date_nanos
          type: string
      required:
        - type
      title: Date nanos field format
    Kibana_HTTP_APIs_kbn-field-format-duration:
      additionalProperties: false
      description: Formats a field into a duration value.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            include_space_with_suffix:
              default: true
              description: When true or not provided, the formatted duration includes a space
                between the value and suffix. When false, no space is included.
              title: Include space with suffix
              type: boolean
            input_format:
              anyOf:
                - enum:
                    - picoseconds
                  title: Picoseconds
                  type: string
                - enum:
                    - nanoseconds
                  title: Nanoseconds
                  type: string
                - enum:
                    - microseconds
                  title: Microseconds
                  type: string
                - enum:
                    - milliseconds
                  title: Milliseconds
                  type: string
                - enum:
                    - seconds
                  title: Seconds
                  type: string
                - enum:
                    - minutes
                  title: Minutes
                  type: string
                - enum:
                    - hours
                  title: Hours
                  type: string
                - enum:
                    - days
                  title: Days
                  type: string
                - enum:
                    - weeks
                  title: Weeks
                  type: string
                - enum:
                    - months
                  title: Months
                  type: string
                - enum:
                    - years
                  title: Years
                  type: string
              description: The unit of the field value before formatting.
              title: Input format
            output_format:
              anyOf:
                - description: 'Displays the duration in the largest whole unit that applies,
                    rounded. For example: "2 hours" or "a day".'
                  enum:
                    - humanize
                  title: Human-readable (approximate)
                  type: string
                - description: 'Displays the duration in the largest whole unit that applies, with
                    decimal precision. For example: "2.35 hours".'
                  enum:
                    - humanize_precise
                  title: Human-readable (precise)
                  type: string
                - enum:
                    - as_milliseconds
                  title: Milliseconds
                  type: string
                - enum:
                    - as_seconds
                  title: Seconds
                  type: string
                - enum:
                    - as_minutes
                  title: Minutes
                  type: string
                - enum:
                    - as_hours
                  title: Hours
                  type: string
                - enum:
                    - as_days
                  title: Days
                  type: string
                - enum:
                    - as_weeks
                  title: Weeks
                  type: string
                - enum:
                    - as_months
                  title: Months
                  type: string
                - enum:
                    - as_years
                  title: Years
                  type: string
              description: The unit to convert the field value into for display.
              title: Output format
            output_precision:
              default: 2
              description: The number of decimal places to display in the duration value.
              title: Output precision
              type: number
            show_suffix:
              description: When true, the formatted duration includes a suffix (such as
                "seconds", "milliseconds", or "years"). When false or not
                provided, no suffix is shown.
              title: Show suffix
              type: boolean
            use_short_suffix:
              default: false
              description: When true, the formatted duration uses short suffixes (such as "s",
                "ms", or "h"). When false or not provided, full suffixes are
                used.
              title: Use short suffix
              type: boolean
          required:
            - input_format
            - output_format
        type:
          enum:
            - duration
          type: string
      required:
        - type
        - params
      title: Duration field format
    Kibana_HTTP_APIs_kbn-field-format-geo_point:
      additionalProperties: false
      description: Formats a field into a geo point value.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            transform:
              anyOf:
                - description: Transforms the geo point into a string in the format
                    "latitude,longitude". For example "40.7128,-74.0060".
                  enum:
                    - lat_lon_string
                  title: Lat lon string
                  type: string
                - description: Transforms the geo point into a Well-Known Text (WKT) string. For
                    example "POINT (123.456 78.901)".
                  enum:
                    - wkt
                  title: WKT
                  type: string
                - description: Transforms the geo point into a string in the format
                    "latitude,longitude (degrees, minutes, seconds)". For
                    example "40°42′50.2″N 73°59′45.6″W".
                  enum:
                    - dms
                  title: DMS
                  type: string
                - description: Transforms the geo point into a string in the format
                    "latitude,longitude (Military Grid Reference System)". For
                    example "18SUJ1234567890".
                  enum:
                    - mgrs
                  title: MGRS
                  type: string
                - description: 'Transforms the geo point to all the previous formats. For example:
                    "Lat Long: 40.7128,-74.0060, WKT: POINT (123.456 78.901),
                    DMS: 40°42′50.2″N 73°59′45.6″W, MGRS: 18SUJ1234567890".'
                  enum:
                    - multi
                  title: Multi
                  type: string
              description: The transform to apply to the geo point value.
              title: Transform
          required:
            - transform
        type:
          enum:
            - geo_point
          type: string
      required:
        - type
      title: Geo point field format
    Kibana_HTTP_APIs_kbn-field-format-histogram:
      additionalProperties: false
      description: Formats a histogram field into a numeric value following the
        defined pattern. The default pattern is defined by
        format:bytes:defaultPattern, format:percent:defaultPattern or
        format:number:defaultPattern advanced settings depending on the selected
        format.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            format:
              anyOf:
                - enum:
                    - bytes
                  type: string
                - enum:
                    - percent
                  type: string
                - enum:
                    - number
                  type: string
            pattern:
              description: Numeral.js format pattern. See
                https://www.elastic.co/docs/explore-analyze/numeral-formatting
                to learn more.
              title: Numeral pattern
              type: string
          required:
            - format
        type:
          enum:
            - histogram
          type: string
      required:
        - type
        - params
      title: Histogram field format
    Kibana_HTTP_APIs_kbn-field-format-ip:
      additionalProperties: false
      description: Formats a field into an IP address.
      type: object
      properties:
        type:
          enum:
            - ip
          type: string
      required:
        - type
      title: IP field format
    Kibana_HTTP_APIs_kbn-field-format-number:
      additionalProperties: false
      description: Formats a field into a numeric value following the defined pattern.
        The default pattern is defined by format:number:defaultPattern advanced
        setting.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            pattern:
              description: Numeral.js format pattern. See
                https://www.elastic.co/docs/explore-analyze/numeral-formatting
                to learn more.
              title: Numeral pattern
              type: string
        type:
          enum:
            - number
          type: string
      required:
        - type
      title: Number field format
    Kibana_HTTP_APIs_kbn-field-format-percent:
      additionalProperties: false
      description: Formats a field into a percentage value following the defined
        pattern. The default pattern is defined by format:percent:defaultPattern
        advanced setting.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            pattern:
              description: Numeral.js format pattern. See
                https://www.elastic.co/docs/explore-analyze/numeral-formatting
                to learn more.
              title: Numeral pattern
              type: string
        type:
          enum:
            - percent
          type: string
      required:
        - type
      title: Percent field format
    Kibana_HTTP_APIs_kbn-field-format-relative_date:
      additionalProperties: false
      description: 'Formats a field into a relative date value. For example: "1 day ago".'
      type: object
      properties:
        type:
          enum:
            - relative_date
          type: string
      required:
        - type
      title: Relative date field format
    Kibana_HTTP_APIs_kbn-field-format-static_lookup:
      additionalProperties: false
      description: Formats a field into a static value based on the lookup entries or
        the unknown key value.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            lookup_entries:
              description: The lookup entries to use for the static lookup. The key refers to
                the field value, and the value refers to the new value to
                display.
              items:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    type: string
                required:
                  - key
                  - value
              title: Lookup entries
              type: array
            unknown_key_value:
              description: The value to display for unknown key values. If not provided, the
                field value will be displayed.
              title: Unknown key value
              type: string
          required:
            - lookup_entries
        type:
          enum:
            - static_lookup
          type: string
      required:
        - type
        - params
      title: Static lookup field format
    Kibana_HTTP_APIs_kbn-field-format-string:
      additionalProperties: false
      description: Formats a field into a string value.
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            transform:
              anyOf:
                - description: 'Converts the field value to lowercase. For example: "Some Text" ->
                    "some text".'
                  enum:
                    - lower
                  title: Lower case
                  type: string
                - description: 'Converts the field value to uppercase. For example: "Some Text" ->
                    "SOME TEXT".'
                  enum:
                    - upper
                  title: Upper case
                  type: string
                - description: 'Converts the field value to title case. For example: "some text"
                    -> "Some Text".'
                  enum:
                    - title
                  title: Title
                  type: string
                - description: 'Shortens each dot-separated segment of the field value to its
                    first character, except for the last segment. For example:
                    "dot.notated.string" -> "d.n.string".'
                  enum:
                    - short
                  title: Short dots
                  type: string
                - description: 'Decodes the field value from base64. For example: "U29tZSBUZXh0"
                    -> "Some Text".'
                  enum:
                    - base64
                  title: Base64 decode
                  type: string
                - description: 'Decodes the field value from URL parameter. For example:
                    "Some%20Text" -> "Some Text".'
                  enum:
                    - urlparam
                  title: URL parameter decode
                  type: string
        type:
          enum:
            - string
          type: string
      required:
        - type
      title: String field format
    Kibana_HTTP_APIs_kbn-field-format-truncate:
      additionalProperties: false
      description: Truncates the field value to the specified length. If the field
        value is longer than the specified length, it will be truncated and the
        remaining text will be replaced with "...".
      type: object
      properties:
        params:
          additionalProperties: false
          type: object
          properties:
            field_length:
              type: number
        type:
          enum:
            - truncate
          type: string
      required:
        - type
      title: Truncate field format
    Kibana_HTTP_APIs_kbn-field-format-url:
      additionalProperties: false
      description: Formats a field into a link, image or audio.
      type: object
      properties:
        params:
          discriminator:
            propertyName: type
          oneOf:
            - additionalProperties: false
              type: object
              properties:
                label_template:
                  description: 'The template to use for the label. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{url}}. For example: "{{value}}".'
                  title: Label template
                  type: string
                open_link_in_current_tab:
                  description: When true, the URL opens in the current tab. When false or not
                    provided, the URL opens in a new tab.
                  title: Open link in current tab
                  type: boolean
                type:
                  description: Displays the field value as a hyperlink.
                  enum:
                    - a
                  title: Link
                  type: string
                url_template:
                  description: 'The template to use for the URL. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{risonValue}}. Use {{risonValue}} when
                    embedding the field value inside Kibana app URL rison state
                    (for example: query:''{{risonValue}}''). For example:
                    "https://example.com/{{value}}".'
                  title: URL template
                  type: string
              required:
                - type
            - additionalProperties: false
              type: object
              properties:
                height:
                  description: The height of the image. If not provided, the image will be
                    displayed at the original height.
                  title: Height
                  type: number
                label_template:
                  description: 'The template to use for the label. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{url}}. For example: "{{value}}".'
                  title: Label template
                  type: string
                type:
                  description: Displays the field value as an image.
                  enum:
                    - img
                  title: Image
                  type: string
                url_template:
                  description: 'The template to use for the URL. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{risonValue}}. Use {{risonValue}} when
                    embedding the field value inside Kibana app URL rison state
                    (for example: query:''{{risonValue}}''). For example:
                    "https://example.com/{{value}}".'
                  title: URL template
                  type: string
                width:
                  description: The width of the image. If not provided, the image will be
                    displayed at the original width.
                  title: Width
                  type: number
              required:
                - type
            - additionalProperties: false
              type: object
              properties:
                label_template:
                  description: 'The template to use for the label. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{url}}. For example: "{{value}}".'
                  title: Label template
                  type: string
                type:
                  description: Displays the field value as an audio player.
                  enum:
                    - audio
                  title: Audio
                  type: string
                url_template:
                  description: 'The template to use for the URL. The template is a string that
                    contains the field value. The field value is replaced with
                    the template. The available placeholders are: {{value}},
                    {{rawValue}} and {{risonValue}}. Use {{risonValue}} when
                    embedding the field value inside Kibana app URL rison state
                    (for example: query:''{{risonValue}}''). For example:
                    "https://example.com/{{value}}".'
                  title: URL template
                  type: string
              required:
                - type
        type:
          enum:
            - url
          type: string
      required:
        - type
        - params
      title: URL field format
    Kibana_HTTP_APIs_kbn-field-settings-entry:
      anyOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-composite-runtime-field-schema'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-schema'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-data-view-field-setting'
      description: Display overrides for an indexed field, or a runtime field
        definition when `type` is set to a runtime field kind.
      title: Field settings or runtime field
    Kibana_HTTP_APIs_kbn-index-pattern-schema:
      description: 'The index pattern (Elasticsearch index expression) to use as the
        data source. Example: "my-index-*".'
      minLength: 1
      title: Index pattern
      type: string
    Kibana_HTTP_APIs_kbn-runtime-field-base-schema:
      additionalProperties: false
      type: object
      properties:
        custom_description:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-description'
        custom_label:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-label'
        format:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format'
        type:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-type'
      required:
        - type
      title: Runtime field base
    Kibana_HTTP_APIs_kbn-runtime-field-schema:
      additionalProperties: false
      type: object
      properties:
        custom_description:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-description'
        custom_label:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-custom-label'
        format:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-field-format'
        script:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-script'
        type:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_kbn-runtime-field-type'
      required:
        - type
      title: Runtime field
    Kibana_HTTP_APIs_kbn-runtime-field-script:
      description: The script that defines the runtime field. This should be a
        painless script that computes the field value at query time. Runtime
        fields without a script retrieve values from _source. If the field
        doesn't exist in _source, a search request returns no value.
      minLength: 1
      title: Script
      type: string
    Kibana_HTTP_APIs_kbn-runtime-field-type:
      description: The type of the runtime field (e.g., "keyword", "long", "date").
      enum:
        - keyword
        - long
        - double
        - date
        - ip
        - boolean
        - geo_point
      title: Type
      type: string
    Kibana_HTTP_APIs_kbn-time-field-schema:
      description: 'The name of the time field in the index. Used for time-based
        filtering. Example: "@timestamp".'
      title: Time field
      type: string
    Kibana_HTTP_APIs_visApiConfig:
      anyOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visMetricChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visLegacyMetricChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visXyChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visGaugeChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visHeatmapChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visTagcloudChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visRegionMapChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visDatatableChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visPieChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visMosaicChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visTreemapChart'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visWaffleChart'
      description: Visualization configuration. Use the `type` field to specify the
        chart type. Each chart type has its own set of required and optional
        fields.
      title: Visualizations
    Kibana_HTTP_APIs_visApiDirection:
      description: Direction
      enum:
        - asc
        - desc
      type: string
    Kibana_HTTP_APIs_visApiDomainCustom:
      additionalProperties: false
      description: Uses explicitly provided domain bounds (min and max).
      type: object
      properties:
        max:
          description: Max domain value
          type: number
        min:
          description: Min domain value
          type: number
        rounding:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainRounding'
        type:
          enum:
            - custom
          type: string
      required:
        - type
        - min
        - max
    Kibana_HTTP_APIs_visApiDomainFit:
      additionalProperties: false
      description: Uses tight domain bounds from the observed data minimum to maximum,
        without baseline expansion.
      type: object
      properties:
        rounding:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainRounding'
        type:
          enum:
            - fit
          type: string
      required:
        - type
    Kibana_HTTP_APIs_visApiDomainFull:
      additionalProperties: false
      description: Uses the full chart domain, including baseline expansion when
        applicable (for example, includes zero for bar-like series).
      type: object
      properties:
        rounding:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainRounding'
        type:
          enum:
            - full
          type: string
      required:
        - type
    Kibana_HTTP_APIs_visApiDomainRounding:
      default: true
      description: Whether to round axis domain bounds outward to readable “nice”
        values (for example 1, 5, 10, 100) instead of exact data min/max.
      type: boolean
    Kibana_HTTP_APIs_visApiOrientation:
      description: Orientation
      enum:
        - horizontal
        - vertical
        - angled
      type: string
    Kibana_HTTP_APIs_visApiSimpleOrientation:
      description: Orientation
      enum:
        - horizontal
        - vertical
      type: string
    Kibana_HTTP_APIs_visApiXyAxisConfig:
      additionalProperties: false
      description: Axis configuration for X, Y, and Y2 axes. The Y axis is on the
        start (leading) side, the Y2 axis is on the end (trailing) side.
      properties:
        x:
          additionalProperties: false
          description: X-axis configuration
          type: object
          properties:
            domain:
              anyOf:
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFit'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainCustom'
              description: X-axis domain configuration
            grid:
              additionalProperties: false
              description: Axis grid lines configuration
              type: object
              properties:
                visible:
                  description: Show grid lines for this axis
                  type: boolean
              required:
                - visible
            labels:
              additionalProperties: false
              description: Label configuration
              type: object
              properties:
                orientation:
                  $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiOrientation'
                  description: Orientation of the axis labels
            scale:
              anyOf:
                - enum:
                    - ordinal
                  type: string
                - enum:
                    - temporal
                  type: string
                - enum:
                    - linear
                  type: string
              description: X-axis scale type. Use 'temporal' for timestamp/date fields (for
                example, @timestamp or DATE_TRUNC results). Use 'ordinal' for
                categorical/text fields. Use 'linear' for numeric fields.
            ticks:
              additionalProperties: false
              description: Axis tick marks configuration
              type: object
              properties:
                visible:
                  description: Show tick marks on the axis
                  type: boolean
              required:
                - visible
            title:
              additionalProperties: false
              description: Axis title configuration
              type: object
              properties:
                text:
                  description: Axis title text.
                  type: string
                visible:
                  description: When `true`, displays the title.
                  type: boolean
        'y':
          additionalProperties: false
          description: 'Y-axis configuration with scale and bounds. The axis position is
            determined by the key: y renders on the start side (left in vertical
            charts), y2 on the end side (right in vertical charts).'
          type: object
          properties:
            domain:
              default:
                rounding: true
                type: full
              description: Y-axis domain configuration
              discriminator:
                mapping:
                  custom: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainCustom'
                  fit: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFit'
                  full: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFull'
                propertyName: type
              oneOf:
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFull'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFit'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainCustom'
            grid:
              additionalProperties: false
              description: Axis grid lines configuration
              type: object
              properties:
                visible:
                  description: Show grid lines for this axis
                  type: boolean
              required:
                - visible
            labels:
              additionalProperties: false
              description: Label configuration
              type: object
              properties:
                orientation:
                  $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiOrientation'
                  description: Orientation of the axis labels
            scale:
              anyOf:
                - enum:
                    - linear
                  type: string
                - enum:
                    - log
                  type: string
                - enum:
                    - sqrt
                  type: string
              description: Y-axis scale type for data transformation
            ticks:
              additionalProperties: false
              description: Axis tick marks configuration
              type: object
              properties:
                visible:
                  description: Show tick marks on the axis
                  type: boolean
              required:
                - visible
            title:
              additionalProperties: false
              description: Axis title configuration
              type: object
              properties:
                text:
                  description: Axis title text.
                  type: string
                visible:
                  description: When `true`, displays the title.
                  type: boolean
        y2:
          additionalProperties: false
          description: 'Y-axis configuration with scale and bounds. The axis position is
            determined by the key: y renders on the start side (left in vertical
            charts), y2 on the end side (right in vertical charts).'
          type: object
          properties:
            domain:
              default:
                rounding: true
                type: full
              description: Y-axis domain configuration
              discriminator:
                mapping:
                  custom: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainCustom'
                  fit: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFit'
                  full: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFull'
                propertyName: type
              oneOf:
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFull'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainFit'
                - $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiDomainCustom'
            grid:
              additionalProperties: false
              description: Axis grid lines configuration
              type: object
              properties:
                visible:
                  description: Show grid lines for this axis
                  type: boolean
              required:
                - visible
            labels:
              additionalProperties: false
              description: Label configuration
              type: object
              properties:
                orientation:
                  $ref: '#/components/schemas/Kibana_HTTP_APIs_visApiOrientation'
                  description: Orientation of the axis labels
            scale:
              anyOf:
                - enum:
                    - linear
                  type: string
                - enum:
                    - log
                  type: string
                - enum:
                    - sqrt
                  type: string
              description: Y-axis scale type for data transformation
            ticks:
              additionalProperties: false
              description: Axis tick marks configuration
              type: object
              properties:
                visible:
                  description: Show tick marks on the axis
                  type: boolean
              required:
                - visible
            title:
              additionalProperties: false
              description: Axis title configuration
              type: object
              properties:
                text:
                  description: Axis title text.
                  type: string
                visible:
                  description: When `true`, displays the title.
                  type: boolean
      title: Axis
      type: object
    Kibana_HTTP_APIs_visAutoColor:
      additionalProperties: false
      description: Coloring determined at runtime based on chart defaults
      type: object
      properties:
        type:
          enum:
            - auto
          type: string
      required:
        - type
      title: Auto Color
    Kibana_HTTP_APIs_visByteFormat:
      additionalProperties: false
      description: Data size format in bits or bytes, with optional decimal places and
        suffix.
      type: object
      properties:
        decimals:
          default: 2
          description: Number of decimal places to display.
          type: number
        suffix:
          description: Suffix appended to the formatted value.
          type: string
        type:
          anyOf:
            - enum:
                - bits
              type: string
            - enum:
                - bytes
              type: string
          description: 'Data size unit: `bits` or `bytes`.'
      required:
        - type
      title: Byte Format
    Kibana_HTTP_APIs_visCategoricalColorMapping:
      additionalProperties: false
      description: Palette color assignment for specific categorical values. Unmapped
        values receive the unassigned color.
      type: object
      properties:
        mapping:
          items:
            additionalProperties: false
            type: object
            properties:
              color:
                anyOf:
                  - $ref: '#/components/schemas/Kibana_HTTP_APIs_visColorFromPalette'
                  - $ref: '#/components/schemas/Kibana_HTTP_APIs_visColorCode'
              values:
                items:
                  anyOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - $ref: '#/components/schemas/Kibana_HTTP_APIs_visMultiValueCell'
                    - $ref: '#/components/schemas/Kibana_HTTP_APIs_visRangeKey'
                    - $ref: '#/components/schemas/Kibana_HTTP_APIs_visMultiFieldKey'
                  nullable: true
                maxItems: 1000
                type: array
            required:
              - values
              - color
          maxItems: 1000
          type: array
        mode:
          enum:
            - categorical
          type: string
        palette:
          description: "Color palette name. Accepted values: 'default',
            'elastic_line_optimized', 'severity', 'eui_amsterdam',
            'kibana_v7_legacy', 'elastic_brand_2023'. Defaults to `default`."
          type: string
        unassigned:
          $ref: '#/components/schemas/Kibana_HTTP_APIs_visUnassignedColorSchema'
      required:
        - mode
        - palette
        - mapping
      title: Categorical Color Mapping
    Kibana_HTTP_APIs_visCollapseBy:
      anyOf:
        - enum:
            - avg
          type: string
        - enum:
            - sum
          type: string
        - enum:
            - max
          type: string
        - enum:
            - min
          type: string
      description: Aggregation function used to collapse a breakdown dimension into a
        single value.
    Kibana_HTTP_APIs_visColorByValue:
      anyOf:
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visColorByValueAbsolute'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visColorByValuePercentage'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visColorByValuePalette'
        - $ref: '#/components/schemas/Kibana_HTTP_APIs_visLegacyColorByValue'
      description: Dynamic color mapping by numeric range, with support for absolute
        and percentage-based ranges and for named palettes.
      title: Color By Value
    Kibana_HTTP_APIs_visColorByValueAbsolute:
      additionalProperties: false
      description: Color by absolute value configuration
      type: object
      properties:
        range:
          enum:
            - absolute
          type: string
        steps:
          description: Array of ordered color steps defining the range each color is
            applied.
          items:
            additionalProperties: false
            type: object
            properties:
              color:
                description: The color to use for this step.
                type: string
              gte:
                description: The lower bound of range from which this color applies (inclusive).
                nullable: true
                type: number
              lt:
                description: The upper bound of range to which this color applies (exclusive).
                nullable: true
                type: number
              lte:
                description: The upper bound of range to which this color applies (inclusive).
                nullable: true
                type: number
            required:
              - color
          maxItems: 100
          minItems: 1
          type: array
        type:
          enum:
            - dynamic
          type: string
      required:
        - type
        - range
        - steps
      title: Color By Value (Absolute)
    Kibana_HTTP_APIs_visColorByValuePalette:
      additionalProperties: false
      description: Color by value using a palette, with colors distributed across the
        range of values.
      type: object
      properties:
        palette:
          anyOf:
            - enum:
                - status
              type: string
            - enum:
                - temperature
              type: string
            - enum:
                - complementary
              type: string
            - enum:
                - negative
              type: string
            - enum:
                - positive
              type: string
            - enum:
                - cool
              type: string
            - enum:
                - warm
              type: string
            - enum:
                - gray
              type: string
          description: The name of the palette to apply across the value range.
        type:
          enum:
            - distributed_palette
          type: string
      required:
        - type
        - palette
